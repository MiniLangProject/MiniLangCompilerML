[project]
name = "MiniLang Self-Hosted Compiler"
description = "API and implementation reference for the self-hosted MiniLang compiler."
entry = "mlc_win64.ml"
source_roots = ["mlc"]
include = ["."]
exclude = ["build", "docs/api"]
target = "windows-x64"

[documentation]
include_internal = true
reachable_only = false
strict = true
dependencies = "summary"
contract_warnings = "public"
summary_quality_warnings = "public"
duplicate_summary_threshold = 3
page_granularity = "container"

[output]
formats = ["html", "markdown"]
html_dir = "docs/api/compiler/html"
markdown_dir = "docs/api/compiler/markdown"
markdown_profile = "repository"
include_timestamp = false

[graphs]
imports = true
calls = true
types = true
format = "svg"
max_nodes = 300
granularity = "package"
hide_empty = true

[links]
repository = "https://github.com/MiniLangProject/MiniLangCompilerML"
ref = "main"
